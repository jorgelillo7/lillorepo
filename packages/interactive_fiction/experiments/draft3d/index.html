<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#000000" />
    <!-- Added to the home screen, it opens full screen, without the browser's bars. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Samantha" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Borrador 3D</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <main class="stage" id="stage">
      <canvas id="world" aria-label="Escena"></canvas>
      <img id="flat" alt="" hidden />
      <div class="mood" aria-hidden="true"><canvas id="grain"></canvas></div>
      <div id="spots" class="spots"></div>

      <section class="subs" id="subs" aria-live="polite" hidden>
        <div class="subs-text" id="subs-text"></div>
        <div class="subs-bar">
          <button class="subs-btn" id="subs-next">Continuar <span aria-hidden="true">›</span></button>
          <button class="subs-btn" id="subs-close" hidden>Explorar</button>
          <span class="subs-end" id="subs-end" hidden>
            <span class="subs-code" id="subs-code"></span>
            <button class="subs-btn" id="subs-next-chapter" hidden></button>
            <button class="subs-btn ghost" id="subs-menu">Menú</button>
          </span>
        </div>
      </section>

      <section class="prompt" id="prompt" hidden>
        <span class="prompt-label" id="prompt-label"></span>
        <div class="prompt-actions" id="prompt-actions"></div>
        <button class="subs-btn ghost" id="prompt-cancel">Volver</button>
      </section>

      <button class="reopen" id="reopen" hidden aria-label="Leer el texto">Texto</button>
      <p class="hint" id="hint" hidden>Arrastra para mirar · toca lo que brilla</p>
      <span class="badge">Borrador 3D</span>
      <section class="rotate" role="alert">
        <div class="rotate-phone" aria-hidden="true"></div>
        <p>Gira el móvil en horizontal</p>
      </section>

      <div class="veil" id="veil" aria-hidden="true"><span class="veil-bar"></span></div>

      <section class="title" id="title">
        <h1 class="title-name" id="title-name"></h1>
        <nav class="title-menu" id="title-menu"></nav>
        <p class="title-warning" id="title-warning"></p>
        <button class="title-credits" id="title-credits" hidden></button>
        <p class="title-tip" id="title-tip">Para jugar a pantalla completa en iPhone: Compartir → Añadir a pantalla de inicio, y ábrelo desde el icono.</p>
      </section>

      <section class="about" id="about" hidden>
        <p class="title-series" id="about-series"></p>
        <h2 class="about-title">Acerca de</h2>
        <div class="about-body" id="about-body"></div>
        <button class="subs-btn ghost" id="about-close">← Volver</button>
      </section>
    </main>
    <script type="module" src="/main.ts"></script>
  </body>
</html>
