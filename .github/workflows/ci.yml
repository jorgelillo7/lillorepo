# CI gate for pull requests: lint + full test suite, no deploys.
# Deploys stay exclusively in deploy.yml (push to master). Branch
# protection on master requires the "Lint", "Test" and "Interactive fiction"
# checks below, so a red PR cannot be merged.
name: CI

on:
  # Every pull request, whatever it targets. Restricted to `master`, a PR
  # stacked on another branch got no checks at all — and looked unverified
  # because it was. Merging its base with --delete-branch then *closed* it,
  # and a closed PR can be neither reopened nor retargeted, so the work had
  # to be rebased and opened under a new number. The affected-test selector
  # already diffs against `github.base_ref`, so a stacked PR tests exactly
  # its own delta.
  pull_request:
  # Manual trigger. `deploy.yml` has always had one; this did not, so when
  # GitHub throttled webhook-triggered runs during the 2026-08-06 Actions
  # outage the only way to re-fire CI was pushing an empty commit.
  workflow_dispatch:

# A new push to the PR obsoletes the previous run — cancel it.
#
# Note when re-running by hand: a manual re-run shares this group, so if it
# overlaps another run for the same ref one of the two is cancelled. Re-running
# in a loop cancels itself; wait for the attempt to finish before firing again.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          # The external repositories are the bulk of a cold run: rules_python
          # plus every pypi wheel (matplotlib, google-cloud-*, flask). Without
          # these two the runner re-downloads them every single time — the disk
          # cache alone was saving 4 KB, because it holds action outputs and
          # almost nothing else.
          # Keyed on the locks too: setup-bazel hashes only MODULE.bazel by
          # default, so a new wheel in the lock reused the old key, restored a
          # cache without it, and was downloaded again by every job.
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - requirements_lock.txt
          # Named, so CI's job and the deploy's share one manifest (the default,
          # <workflow>-<job>, never matched across workflows). Under Bazel 9
          # most of external/ is links into the repository cache, so the
          # wheels themselves travel in `repository-cache`.
          external-cache: |
            name: lint
          # One key across workflows, so the deploy inherits what CI just warmed
          # instead of starting cold a minute after a green PR.
          disk-cache: bazel

      # mypy re-analyses every file and every library stub without its cache:
      # ~30 s on a runner against ~1 s warm. Saved per commit, restored from
      # the newest one with the same lock and config (PRs read master's).
      # rules_swift (rules_python → rules_apple → rules_swift) auto-configures
      # a Swift toolchain whenever Bazel resolves any toolchain, and on this
      # runner, which ships swiftc, its probe compiles a test program: ~40 s
      # per job, never cached (a local repository rule). Nothing here builds
      # Swift; without swiftc on PATH the probe is skipped.
      - name: Hide swiftc from Bazel
        run: sudo rm -f "$(command -v swiftc)"

      - name: Restore mypy's cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .mypy_cache
          key: mypy-${{ hashFiles('requirements_lock.txt', 'mypy.ini') }}-${{ github.sha }}
          # Any older cache beats none: mypy re-checks what changed and drops
          # a cache written by another mypy version on its own.
          restore-keys: |
            mypy-${{ hashFiles('requirements_lock.txt', 'mypy.ini') }}-
            mypy-

      - name: Lint
        run: bash scripts/lint.sh

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `affected_tests.py` diffs against the merge base, which needs the
          # history a shallow clone does not have.
          fetch-depth: 0

      - name: Set up Bazel
        uses: bazel-contrib/setup-bazel@104e3eea9447cdaa4b00d0fb46191a3985d26ab3 # 0.19.1
        with:
          bazelisk-cache: true
          # The external repositories are the bulk of a cold run: rules_python
          # plus every pypi wheel (matplotlib, google-cloud-*, flask). Without
          # these two the runner re-downloads them every single time — the disk
          # cache alone was saving 4 KB, because it holds action outputs and
          # almost nothing else.
          # Keyed on the locks too: setup-bazel hashes only MODULE.bazel by
          # default, so a new wheel in the lock reused the old key, restored a
          # cache without it, and was downloaded again by every job.
          repository-cache: |
            - MODULE.bazel
            - MODULE.bazel.lock
            - requirements_lock.txt
          # Named, so CI's job and the deploy's share one manifest (the default,
          # <workflow>-<job>, never matched across workflows). Under Bazel 9
          # most of external/ is links into the repository cache, so the
          # wheels themselves travel in `repository-cache`.
          external-cache: |
            name: test
          # One key across workflows, so the deploy inherits what CI just warmed
          # instead of starting cold a minute after a green PR.
          disk-cache: bazel

      # rules_swift (rules_python → rules_apple → rules_swift) auto-configures
      # a Swift toolchain whenever Bazel resolves any toolchain, and on this
      # runner, which ships swiftc, its probe compiles a test program: ~40 s
      # per job, never cached (a local repository rule). Nothing here builds
      # Swift; without swiftc on PATH the probe is skipped.
      - name: Hide swiftc from Bazel
        run: sudo rm -f "$(command -v swiftc)"

      - name: Pick the tests this change can break
        id: affected
        run: |
          git fetch --quiet origin "${{ github.base_ref || 'master' }}"
          TARGETS=$(python3 scripts/affected_tests.py \
            "origin/${{ github.base_ref || 'master' }}")
          echo "targets<<EOF" >> "$GITHUB_OUTPUT"
          echo "$TARGETS" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"
          if [ -z "$TARGETS" ]; then
            echo "Nothing to test: no changed file belongs to a Bazel package."
          else
            echo "Testing:"; echo "$TARGETS" | sed 's/^/  /'
          fi

      - name: Run the affected tests, with coverage
        # Deliberately not `if:` on the job — a skipped job never reports, and
        # `Test` is a required check, so the PR would block forever. The job
        # always runs and always reports; it just may have nothing to do.
        if: steps.affected.outputs.targets != ''
        run: |
          # `--build_tests_only` keeps this to the tests and their deps; without
          # it `//...` would also build all 40 image and tar targets.
          #
          # The target list comes from `rdeps` over the real build graph, never
          # from a per-module list in this file: the two workflows used to keep
          # their own copy and had already drifted — `draft_skill_tests` ran on
          # pull requests and never on master, which is the branch that deploys.
          #
          # `coverage` runs the same tests, instrumented — one pass, not two.
          echo "${{ steps.affected.outputs.targets }}" | xargs \
            bazel coverage --build_tests_only --combined_report=lcov \
              --test_output=streamed --test_arg=-v

      # Report-only. It fails when the report is missing or empty (the step
      # broke, or only suites that record nothing ran); that shows on the job
      # without blocking it — the tests above are what gate the PR.
      - name: Coverage summary
        if: steps.affected.outputs.targets != ''
        continue-on-error: true
        run: |
          REPORT="$(bazel info output_path)/_coverage/_coverage_report.dat"
          echo "${{ steps.affected.outputs.targets }}" | xargs \
            python3 scripts/coverage_report.py "$REPORT" >> "$GITHUB_STEP_SUMMARY"

  # The interactive-fiction reader is a Node package outside Bazel. A required
  # check, so the job always runs and succeeds; its steps run only when the PR
  # touches the package. The story text is not in the repo, so CI tests the
  # engine on its own fixture story.
  interactive-fiction:
    name: Interactive fiction
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/interactive_fiction
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did this change touch the package?
        id: changed
        run: |
          git fetch --quiet origin "${{ github.base_ref || 'master' }}"
          if git diff --quiet "origin/${{ github.base_ref || 'master' }}"...HEAD -- . ; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/interactive_fiction/package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.run == 'true'
        run: npm test

  # The gift list, a Node Worker outside Bazel, set up like the reader above: the job
  # always runs and succeeds, and its steps run only when the PR touches the package.
  wishlist:
    name: Wishlist
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/wishlist
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Did this change touch the package?
        id: changed
        run: |
          git fetch --quiet origin "${{ github.base_ref || 'master' }}"
          if git diff --quiet "origin/${{ github.base_ref || 'master' }}"...HEAD -- . ; then
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.changed.outputs.run == 'true'
        with:
          node-version: 26
          cache: npm
          cache-dependency-path: packages/wishlist/package-lock.json
      - if: steps.changed.outputs.run == 'true'
        run: npm ci
      - if: steps.changed.outputs.run == 'true'
        run: npm run typecheck
      - if: steps.changed.outputs.run == 'true'
        run: npm test
