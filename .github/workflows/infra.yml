# Terraform plan for infra/, read-only. Runs on pull requests that touch it
# and weekly against master as a drift check; apply is never run here — the
# owner applies locally (infra/README.md).
name: Infra

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: infra-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    name: Terraform plan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    env:
      TF_IN_AUTOMATION: "1"
      TF_VAR_billing_account: ${{ secrets.TF_BILLING_ACCOUNT }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Authenticate to GCP (read-only identity)
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: projects/319945089838/locations/global/workloadIdentityPools/github-plan/providers/github-plan
          service_account: terraform-plan@biwenger-tools.iam.gserviceaccount.com

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.4
          terraform_wrapper: false

      - name: Format
        run: terraform fmt -check -recursive

      - name: Init
        run: terraform init -input=false

      - name: Validate
        run: terraform validate -no-color

      # Exit code 2 means "changes pending": expected on a pull request, drift
      # on the weekly run against master.
      - name: Plan
        id: plan
        run: |
          set +e
          terraform plan -lock=false -input=false -no-color -detailed-exitcode > plan.txt
          code=$?
          set -e
          cat plan.txt
          {
            echo "## Terraform plan"
            echo
            grep -E '^(Plan|No changes)' plan.txt || true
            echo
            echo '<details><summary>Full plan</summary>'
            echo
            echo '```'
            cat plan.txt
            echo '```'
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "exitcode=$code" >> "$GITHUB_OUTPUT"
          if [ "$code" -eq 1 ]; then exit 1; fi

      - name: Fail on drift
        if: github.event_name != 'pull_request' && steps.plan.outputs.exitcode == '2'
        run: |
          echo "::error::infra/ and production differ — see the plan above."
          exit 1
