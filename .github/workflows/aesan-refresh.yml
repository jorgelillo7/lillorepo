name: Recognised-waters refresh

# The registry the be_water catalog measures itself against changes a few times
# a year, and its source has moved once already: the snapshot in the repo sat
# eight years out of date on a URL that had started returning 404, and nobody
# noticed until a bottle happened to raise the question. This runs the refresh
# monthly so both cases surface on their own — a changed list arrives as a PR
# to review, a dead source as a red run and a Telegram message.
on:
  schedule:
    - cron: "0 6 1 * *" # day 1, ~08:00 Madrid — ahead of the catalog sync
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  refresh:
    name: Refresh the recognised-waters snapshot
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/319945089838/locations/global/workloadIdentityPools/github/providers/github-oidc
          service_account: biwenger-tools-sa@biwenger-tools.iam.gserviceaccount.com

      - name: Set up gcloud CLI
        uses: google-github-actions/setup-gcloud@v3

      - name: Read the be_water Telegram config
        id: telegram
        run: |
          CFG=$(gcloud secrets versions access latest \
            --secret=flask-web-config-regional --project=be-water-app)
          echo "::add-mask::$(echo "$CFG" | jq -r .telegram_bot_token)"
          {
            echo "token=$(echo "$CFG" | jq -r .telegram_bot_token)"
            echo "chat=$(echo "$CFG" | jq -r .telegram_chat_id)"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      # pypdf stays out of the runtime image on purpose — the service never
      # parses a PDF. Here it costs nothing.
      - name: Install the generator's dependencies
        run: pip install --quiet pypdf black

      # Exits non-zero when the download is not a PDF, or the parse looks
      # wrong, rather than writing a damaged snapshot.
      - name: Regenerate the snapshot
        run: python3 packages/be_water/scripts/refresh_aesan_snapshot.py

      - name: Is there news?
        id: diff
        run: |
          if git diff --quiet -- packages/be_water/web/aesan_snapshot.py; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- packages/be_water/web/aesan_snapshot.py
          fi

      - name: Open a PR with the diff
        if: steps.diff.outputs.changed == 'true'
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BRANCH="chore/aesan-refresh-$(date +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add packages/be_water/web/aesan_snapshot.py
          printf '%s\n' \
            'chore(be_water): refresh the recognised-waters snapshot' \
            '' \
            'Generated by .github/workflows/aesan-refresh.yml. The diff is the' \
            'news: waters Spain has recognised or dropped since the last' \
            'refresh.' > /tmp/commit-msg.txt
          git commit -F /tmp/commit-msg.txt
          git push -u origin "$BRANCH"
          printf '%s\n' \
            'The official list changed. This snapshot is the generator output —' \
            'the diff is the actual news: waters Spain has recognised or dropped' \
            'since the last refresh.' \
            '' \
            'Before merging, check that no water already in the catalog lost its' \
            'registry match. The coverage figure on /comunidad moves with the' \
            'unique-name count, which is expected.' \
            '' \
            '> **Checks will not start on their own.** GitHub does not fire' \
            '> workflows for pull requests opened with `GITHUB_TOKEN`. Close and' \
            '> reopen this PR to trigger `Lint` and `Test`, then merge as usual.' \
            > /tmp/pr-body.md
          URL=$(gh pr create --base master --head "$BRANCH" \
            --title "chore(be_water): refresh the recognised-waters snapshot" \
            --body-file /tmp/pr-body.md)
          echo "url=$URL" >> "$GITHUB_OUTPUT"

      - name: Tell Telegram the list changed
        if: steps.diff.outputs.changed == 'true'
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ steps.telegram.outputs.token }}/sendMessage" \
            -d chat_id="${{ steps.telegram.outputs.chat }}" \
            --data-urlencode text="💧 La lista oficial de aguas reconocidas ha cambiado.
          Revisa el diff: ${{ steps.pr.outputs.url }}
          (cierra y reabre la PR para que arranquen los checks)"

      # The failure that matters: the source moved, or the document's layout
      # changed enough that the parse is no longer trustworthy. Both mean the
      # snapshot silently stops tracking reality.
      - name: Tell Telegram it broke
        if: failure() && steps.telegram.outputs.token != ''
        run: |
          curl -sS -X POST \
            "https://api.telegram.org/bot${{ steps.telegram.outputs.token }}/sendMessage" \
            -d chat_id="${{ steps.telegram.outputs.chat }}" \
            --data-urlencode text="⚠️ El refresco del registro de aguas ha fallado.
          Probablemente la fuente se ha movido otra vez, o cambió el formato del PDF.
          ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
