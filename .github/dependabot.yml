# GitHub Actions, the Node packages and Terraform. Python deps are deliberately excluded: the
# three-level lock flow (requirements.txt → requirements.in → pip-compile
# lock) plus the Bazel wiring and the python-base image rebuild cannot be
# driven by a bot — use the add-python-dep skill instead (and, for bumps,
# .claude/skills/check-deps/UPGRADING.md). Python advisories still arrive as
# Dependabot alerts. Actions are pinned to commit SHAs; the `# vX.Y.Z`
# comment on each is what Dependabot reads and rewrites.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      # One PR per month covering every action bump — each merge of
      # deploy.yml triggers a full redeploy, so batching beats five PRs.
      actions:
        patterns: ["*"]

  # The two Node packages sit outside Bazel, each with its own lockfile and a
  # separate deploy/ toolchain (Wrangler). Minor and patch bumps arrive as one
  # PR per directory; majors stay individual so they get read.
  - package-ecosystem: "npm"
    directories:
      - "/packages/interactive_fiction"
      - "/packages/interactive_fiction/deploy"
      - "/packages/wishlist"
      - "/packages/wishlist/deploy"
    schedule:
      interval: "weekly"
    groups:
      npm-minor-patch:
        update-types: ["minor", "patch"]

  # Provider bumps for infra/ (the lock file is updated with them).
  - package-ecosystem: "terraform"
    directory: "/infra"
    schedule:
      interval: "weekly"
    groups:
      terraform-minor-patch:
        update-types: ["minor", "patch"]
