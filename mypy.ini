# Type checking, run by scripts/lint.sh at the lock's version (LP-23).
# Gradual: a tree joins `files` once it is clean, and stays clean.
[mypy]
python_version = 3.14
files = $MYPY_CONFIG_FILE_DIR/core
exclude = (^|/)tests/
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
warn_unused_ignores = True
warn_redundant_casts = True

# Libraries that ship no types and have no typeshed stubs. Ignored by name,
# never globally: a new untyped import has to be listed here on purpose.
[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-google.auth.*]
ignore_missing_imports = True

[mypy-google.oauth2.*]
ignore_missing_imports = True
