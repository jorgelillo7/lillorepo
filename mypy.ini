# Type checking, run by scripts/lint.sh at the lock's version (LP-23).
# Gradual: a tree joins `files` once it is clean, and stays clean.
[mypy]
python_version = 3.14
files = $MYPY_CONFIG_FILE_DIR/core, $MYPY_CONFIG_FILE_DIR/packages/chucknorris_bot, $MYPY_CONFIG_FILE_DIR/packages/biwenger_tools/scraper_job, $MYPY_CONFIG_FILE_DIR/packages/biwenger_tools/bot, $MYPY_CONFIG_FILE_DIR/packages/biwenger_tools/constants.py, $MYPY_CONFIG_FILE_DIR/packages/be_water, $MYPY_CONFIG_FILE_DIR/packages/biwenger_tools/api, $MYPY_CONFIG_FILE_DIR/packages/biwenger_tools/web
exclude = (^|/)tests/
explicit_package_bases = True
mypy_path = $MYPY_CONFIG_FILE_DIR
warn_unused_ignores = True
warn_redundant_casts = True

# Libraries that ship no types and have no typeshed stubs. Ignored by name,
# never globally: a new untyped import has to be listed here on purpose.
[mypy-googleapiclient.*]
ignore_missing_imports = True

[mypy-google.auth.*]
ignore_missing_imports = True

[mypy-google.oauth2.*]
ignore_missing_imports = True

# Not in the lock on purpose: only be_water's AESAN refresh script uses it,
# installed by hand (packages/be_water/OPERATIONS.md).
[mypy-pypdf.*]
ignore_missing_imports = True
